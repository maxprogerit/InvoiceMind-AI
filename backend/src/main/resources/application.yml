server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    # Read (and discard) the rest of an oversized upload so the client receives a clean 413
    # instead of a connection reset. Bounded: bodies beyond this are dropped.
    max-swallow-size: 20MB

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: invoicemind-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoicemind}
    username: ${SPRING_DATASOURCE_USERNAME:invoicemind}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    template:
      observation-enabled: true   # the trace context travels in the Kafka record headers
    listener:
      observation-enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}                  # OpenTelemetry; see docs/ARCHITECTURE.md (Observability)
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    org.apache.kafka: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl-seconds: ${APP_JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${APP_JWT_REFRESH_TTL_SECONDS:1209600}
  cookies:
    secure: ${APP_COOKIES_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}
  storage:
    type: ${STORAGE_TYPE:local}          # local (a volume) or s3 (AWS S3 / MinIO / any S3-compatible store)
    root: ${APP_STORAGE_ROOT:./storage}
    max-file-bytes: 15728640
    s3:
      bucket: ${S3_BUCKET:invoicemind}
      region: ${S3_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}          # empty = AWS; http://minio:9000 for MinIO
      access-key: ${S3_ACCESS_KEY:}      # empty = SDK default credential chain (IAM role etc.)
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:false} # true for MinIO
      create-bucket: ${S3_CREATE_BUCKET:false}
  ai:
    base-url: ${APP_AI_BASE_URL:http://localhost:8000}
    token: ${APP_AI_TOKEN}
    connect-timeout-ms: 5000
    ocr-timeout-ms: 120000
    extract-timeout-ms: 120000
    retry-attempts: 3
    retry-initial-backoff-ms: 1000
    circuit-failure-rate: 50
    circuit-open-seconds: 30
  processing:
    topic: invoice.uploaded
    stuck-after-minutes: 10
    requeue-uploaded-after-minutes: 2
  rate-limit:
    auth-per-minute: 20     # login/register per IP (credential stuffing)
    refresh-per-minute: 300 # every page load refreshes the session; tokens are 256-bit, so this only protects the DB
    upload-per-minute: 60
  webhooks:
    allow-private-targets: ${APP_WEBHOOKS_ALLOW_PRIVATE_TARGETS:false}  # SSRF guard, see WebhookProperties
    timeout-ms: 8000
    max-attempts: 8
    retry-base-seconds: 30
  oidc:                                    # single sign-on (off by default), see OidcProperties
    enabled: ${OIDC_ENABLED:false}
    issuer-uri: ${OIDC_ISSUER_URI:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    scopes: ${OIDC_SCOPES:openid email profile}
    button-label: ${OIDC_BUTTON_LABEL:Single sign-on}
    public-url: ${OIDC_PUBLIC_URL:}          # https://invoices.example.com ; derived from the request if empty
    require-email-verified: ${OIDC_REQUIRE_EMAIL_VERIFIED:true}
    auto-provision-organization-id: ${OIDC_PROVISION_ORG_ID:}
    default-role: ${OIDC_DEFAULT_ROLE:USER}
    allowed-email-domains: ${OIDC_ALLOWED_EMAIL_DOMAINS:}
  mail:                                    # e-mail ingestion (off by default), see EmailIngestService
    enabled: ${MAIL_INGEST_ENABLED:false}
    scheduled: true                        # tests switch the poller off and call pollOnce() themselves
    address: ${MAIL_INGEST_ADDRESS:}         # the mailbox people send to, e.g. invoices@example.com
    host: ${MAIL_IMAP_HOST:}
    port: ${MAIL_IMAP_PORT:993}
    username: ${MAIL_IMAP_USER:}
    password: ${MAIL_IMAP_PASSWORD:}
    ssl: ${MAIL_IMAP_SSL:true}
    folder: ${MAIL_IMAP_FOLDER:INBOX}
    poll-seconds: ${MAIL_POLL_SECONDS:60}
    require-auth-results: ${MAIL_REQUIRE_AUTH_RESULTS:false}
  fx:
    enabled: ${APP_FX_ENABLED:true}
    base-url: ${APP_FX_BASE_URL:https://api.frankfurter.dev/v1}
    timeout-ms: 8000
    retry-after-minutes: 15
  seed:
    demo-password: ${APP_DEMO_PASSWORD:}
