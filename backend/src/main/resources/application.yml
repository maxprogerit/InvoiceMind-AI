server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    # Read (and discard) the rest of an oversized upload so the client receives a clean 413
    # instead of a connection reset. Bounded: bodies beyond this are dropped.
    max-swallow-size: 20MB

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: invoicemind-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoicemind}
    username: ${SPRING_DATASOURCE_USERNAME:invoicemind}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    org.apache.kafka: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl-seconds: ${APP_JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${APP_JWT_REFRESH_TTL_SECONDS:1209600}
  cookies:
    secure: ${APP_COOKIES_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}
  storage:
    root: ${APP_STORAGE_ROOT:./storage}
    max-file-bytes: 15728640
  ai:
    base-url: ${APP_AI_BASE_URL:http://localhost:8000}
    token: ${APP_AI_TOKEN}
    connect-timeout-ms: 5000
    ocr-timeout-ms: 120000
    extract-timeout-ms: 120000
    retry-attempts: 3
    retry-initial-backoff-ms: 1000
    circuit-failure-rate: 50
    circuit-open-seconds: 30
  processing:
    topic: invoice.uploaded
    stuck-after-minutes: 10
    requeue-uploaded-after-minutes: 2
  rate-limit:
    auth-per-minute: 20     # login/register per IP (credential stuffing)
    refresh-per-minute: 300 # every page load refreshes the session; tokens are 256-bit, so this only protects the DB
    upload-per-minute: 60
  webhooks:
    allow-private-targets: ${APP_WEBHOOKS_ALLOW_PRIVATE_TARGETS:false}  # SSRF guard, see WebhookProperties
    timeout-ms: 8000
    max-attempts: 8
    retry-base-seconds: 30
  fx:
    enabled: ${APP_FX_ENABLED:true}
    base-url: ${APP_FX_BASE_URL:https://api.frankfurter.dev/v1}
    timeout-ms: 8000
    retry-after-minutes: 15
  seed:
    demo-password: ${APP_DEMO_PASSWORD:}
