spring:
  datasource:
    password: provided-by-testcontainers
  jpa:
    show-sql: false

app:
  jwt:
    secret: integration-test-secret-0123456789-abcdef
    access-ttl-seconds: 900
    refresh-ttl-seconds: 3600
  storage:
    root: ${java.io.tmpdir}/invoicemind-it-storage
  ai:
    token: test-token
    retry-attempts: 2
    retry-initial-backoff-ms: 20
    circuit-failure-rate: 100
  rate-limit:
    auth-per-minute: 100000
    refresh-per-minute: 100000
    upload-per-minute: 100000
  webhooks:
    allow-private-targets: true   # the receiver double listens on 127.0.0.1
    poll-ms: 100
    retry-base-seconds: 1
    max-attempts: 4
  mail:
    enabled: true
    address: invoices@example.com
    ssl: false
    username: invoices-user
    password: mailbox-secret
    scheduled: false     # the tests call pollOnce() themselves
  fx:
    retry-after-minutes: 0   # tests flip the fake rate source on and off
  seed:
    demo-password: ""

management:
  tracing:
    enabled: true               # on in tests so propagation is verified, but nothing is exported
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: false

logging:
  level:
    org.apache.kafka: ERROR
    org.testcontainers: WARN
    com.zaxxer.hikari: WARN
