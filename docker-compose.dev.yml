# Developer overlay: publishes internal services on 127.0.0.1 only.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Backend API + Swagger: http://localhost:18080/swagger-ui.html   ai-service docs: http://localhost:18000/docs
# Ports are configurable in .env (DEV_BACKEND_PORT / DEV_AI_PORT) in case they clash with other projects.
services:
  backend:
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-18080}:8080"
  ai-service:
    ports:
      - "127.0.0.1:${DEV_AI_PORT:-18000}:8000"
