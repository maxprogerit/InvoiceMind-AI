name: invoicemind

# Fill in .env (cp .env.example .env), then:  docker compose up --build   ->  http://localhost
#
# Networks (who can reach whom):
#   edge     nginx, frontend, backend      the only published port is nginx's HTTP_PORT
#   db       backend, postgres             internal: no outbound traffic, no published port
#   extract  backend, extract-service      internal: the extract-service is reachable only from the backend
#   egress   extract-service               outbound only, for the OpenAI API
# The extract-service is not on `edge`, so neither nginx nor the browser can resolve or reach it, and it
# rejects any request without EXTRACT_SERVICE_TOKEN.

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicemind}
      POSTGRES_USER: ${POSTGRES_USER:-invoicemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # File -> text (PDF text layer or Tesseract) -> OpenAI structured output -> deterministic validation.
  # Stateless: it stores nothing, so it has no database; the backend keeps files, results and history.
  extract-service:
    <<: *restart
    build:
      context: ./extract-service
      target: runtime
    environment:
      EXTRACT_SERVICE_TOKEN: ${EXTRACT_SERVICE_TOKEN:?Set EXTRACT_SERVICE_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_PRICE_INPUT_PER_1M: ${OPENAI_PRICE_INPUT_PER_1M:-0}
      OPENAI_PRICE_OUTPUT_PER_1M: ${OPENAI_PRICE_OUTPUT_PER_1M:-0}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_PRICE_PER_1M: ${OPENAI_EMBEDDING_PRICE_PER_1M:-0}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
    networks: [extract, egress]
    # no `ports:` on purpose

  backend:
    <<: *restart
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invoicemind}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-invoicemind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 characters)}
      APP_AI_BASE_URL: http://extract-service:8000
      APP_AI_TOKEN: ${EXTRACT_SERVICE_TOKEN}
      APP_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${HTTP_PORT:-80},http://localhost,http://localhost:3000
      APP_STORAGE_ROOT: /data/storage
      APP_COOKIES_SECURE: "false" # the demo runs on plain HTTP; set true behind TLS
      APP_FX_ENABLED: ${FX_RATES_ENABLED:-true}
      APP_WEBHOOKS_ALLOW_PRIVATE_TARGETS: ${WEBHOOKS_ALLOW_PRIVATE_TARGETS:-false}
      APP_PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY:-3}
      MAIL_INGEST_ENABLED: ${MAIL_INGEST_ENABLED:-false}
      MAIL_INGEST_ADDRESS: ${MAIL_INGEST_ADDRESS:-}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_USER: ${MAIL_IMAP_USER:-}
      MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD:-}
      MAIL_IMAP_SSL: ${MAIL_IMAP_SSL:-true}
      MAIL_IMAP_FOLDER: ${MAIL_IMAP_FOLDER:-INBOX}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-60}
      MAIL_REQUIRE_AUTH_RESULTS: ${MAIL_REQUIRE_AUTH_RESULTS:-false}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Single sign-on}
      OIDC_PUBLIC_URL: ${OIDC_PUBLIC_URL:-}
      OIDC_REQUIRE_EMAIL_VERIFIED: ${OIDC_REQUIRE_EMAIL_VERIFIED:-true}
      OIDC_PROVISION_ORG_ID: ${OIDC_PROVISION_ORG_ID:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-ACCOUNTANT}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-invoicemind}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      # outgoing mail: daily due-date reminders (defaults to the local Mailpit below)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-invoicemind@localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      REMINDERS_DAYS_AHEAD: ${REMINDERS_DAYS_AHEAD:-3}
      LOG_FORMAT: ecs
    volumes:
      - storage_data:/data/storage
    networks: [edge, db, extract]
    depends_on:
      postgres: { condition: service_healthy }
      extract-service: { condition: service_healthy }

  # Catches every e-mail the backend sends (reminders) for local testing: http://127.0.0.1:8025
  # For real mail set SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_AUTH=true, SMTP_STARTTLS=true in .env.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [edge]

  frontend:
    <<: *restart
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [edge]
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Accuracy, review rate, latency and cost on samples/ with the real model (spend cap EVAL_MAX_COST_USD):
  #   docker compose --profile eval run --rm eval
  eval:
    profiles: ["eval"]
    build:
      context: ./extract-service
      target: runtime
    working_dir: /srv
    environment:
      EXTRACT_SERVICE_TOKEN: ${EXTRACT_SERVICE_TOKEN:?Set EXTRACT_SERVICE_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_PRICE_INPUT_PER_1M: ${OPENAI_PRICE_INPUT_PER_1M:-0}
      OPENAI_PRICE_OUTPUT_PER_1M: ${OPENAI_PRICE_OUTPUT_PER_1M:-0}
      EVAL_EXTRACTOR: ${EVAL_EXTRACTOR:-}
      EVAL_MAX_COST_USD: ${EVAL_MAX_COST_USD:-2.00}
      PYTHONPATH: /srv
    networks: [egress]
    volumes:
      - ./eval:/eval
      - ./extract-service/evaluation:/srv/evaluation:ro
      - ./samples:/samples:ro
      - ./docs:/out
      - ./e2e/fake-ai:/e2e:ro
    command: ["python", "/eval/run_eval.py", "--samples", "/samples", "--out", "/out", "--results", "/eval/results"]

networks:
  edge: {}
  db: { internal: true }
  extract: { internal: true }
  egress: {}

volumes:
  postgres_data:
  storage_data:
