name: invoicemind

# Fill in .env (cp .env.example .env), then:  docker compose up --build
# Only Nginx is published to the network (HTTP_PORT). Everything else is internal,
# except the Postgres port which binds to 127.0.0.1 for local debugging.

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicemind}
      POSTGRES_USER: ${POSTGRES_USER:-invoicemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    # Cache and rate-limit counters only; losing them is harmless, so no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    <<: *restart
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are declared by the backend
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  ai-service:
    <<: *restart
    build:
      context: ./ai-service
      target: runtime
      args:
        WITH_PADDLE: ${WITH_PADDLE:-0}   # 1 = also install PaddleOCR and bake its models in (large image)
        PADDLE_LANG: ${PADDLE_LANG:-de}
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      PADDLE_LANG: ${PADDLE_LANG:-de}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_PRICE_INPUT_PER_1M: ${OPENAI_PRICE_INPUT_PER_1M:-0}
      OPENAI_PRICE_OUTPUT_PER_1M: ${OPENAI_PRICE_OUTPUT_PER_1M:-0}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_PRICE_PER_1M: ${OPENAI_EMBEDDING_PRICE_PER_1M:-0}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}

  backend:
    <<: *restart
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invoicemind}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-invoicemind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 characters)}
      APP_AI_BASE_URL: http://ai-service:8000
      APP_AI_TOKEN: ${AI_SERVICE_TOKEN}
      APP_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${HTTP_PORT:-80},http://localhost,http://localhost:3000
      APP_STORAGE_ROOT: /data/storage
      APP_COOKIES_SECURE: "false" # the demo runs on plain HTTP; set true behind TLS
      APP_FX_ENABLED: ${FX_RATES_ENABLED:-true}
      APP_WEBHOOKS_ALLOW_PRIVATE_TARGETS: ${WEBHOOKS_ALLOW_PRIVATE_TARGETS:-false}
      # Invoice files: STORAGE_TYPE=local keeps them on a volume, s3 uses an S3-compatible store
      # (AWS S3: leave S3_ENDPOINT empty; MinIO, SeaweedFS ...: set S3_ENDPOINT and S3_PATH_STYLE=true).
      # E-mail ingestion (off by default): invoices sent to <mailbox>+<token>@<domain> are imported. See README.
      MAIL_INGEST_ENABLED: ${MAIL_INGEST_ENABLED:-false}
      MAIL_INGEST_ADDRESS: ${MAIL_INGEST_ADDRESS:-}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_USER: ${MAIL_IMAP_USER:-}
      MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD:-}
      MAIL_IMAP_SSL: ${MAIL_IMAP_SSL:-true}
      MAIL_IMAP_FOLDER: ${MAIL_IMAP_FOLDER:-INBOX}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-60}
      MAIL_REQUIRE_AUTH_RESULTS: ${MAIL_REQUIRE_AUTH_RESULTS:-false}
      # Single sign-on (OpenID Connect), off by default. See README "Single sign-on".
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Single sign-on}
      OIDC_PUBLIC_URL: ${OIDC_PUBLIC_URL:-}
      OIDC_REQUIRE_EMAIL_VERIFIED: ${OIDC_REQUIRE_EMAIL_VERIFIED:-true}
      OIDC_PROVISION_ORG_ID: ${OIDC_PROVISION_ORG_ID:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-USER}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-invoicemind}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-invoicemind}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-only-s3-secret-change-me}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      LOG_FORMAT: ecs
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      ai-service: { condition: service_healthy }

  # Accuracy evaluation on samples/ with the real model:  docker compose --profile eval run --rm eval
  eval:
    profiles: ["eval"]
    build:
      context: ./ai-service
      target: runtime
    working_dir: /srv
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_PRICE_INPUT_PER_1M: ${OPENAI_PRICE_INPUT_PER_1M:-0}
      OPENAI_PRICE_OUTPUT_PER_1M: ${OPENAI_PRICE_OUTPUT_PER_1M:-0}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_PRICE_PER_1M: ${OPENAI_EMBEDDING_PRICE_PER_1M:-0}
      EVAL_EXTRACTOR: ${EVAL_EXTRACTOR:-}
      PYTHONPATH: /srv
    volumes:
      - ./eval:/eval
      - ./samples:/samples:ro
      - ./docs:/out
      - ./e2e/fake-ai:/e2e:ro
    command: ["python", "/eval/run_eval.py", "--samples", "/samples", "--out", "/out", "--results", "/eval/results"]

  frontend:
    <<: *restart
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      backend: { condition: service_healthy }

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  kafka_data:
  storage_data:
